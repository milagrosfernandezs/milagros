<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Meta información de la página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>

    <!-- Enlaces a fuentes externas de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;400;700&display=swap" rel="stylesheet">

    <!-- Enlace al archivo de estilos CSS -->
    <link rel="stylesheet" href="../style.css">

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window,document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', 'TU_PIXEL_ID');
    fbq('track', 'PageView');
    fbq('track', 'ViewContent', { content_type: 'product', content_category: 'Buzos Personalizados' });
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=TU_PIXEL_ID&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</head>

<body>

    <!-- Sección de encabezado -->
    <header>
        <!-- Carrito de compras -->
        <div class="carrito">
            <a href="../pages/carrito.html">
                <img class="imagencarrito" src="../img/carrito.png" alt="carrito">
            </a>
        </div>

        <!-- Iconos de redes sociales -->
        <div class="redes">
            <img class="logomedia" src="../img/facebook.png" alt="facebook">
            <img class="logomedia" src="../img/tiktok.png" alt="tiktok">
            <img class="logomedia" src="../img/instagram.png" alt="instagram">
        </div>

        <!-- Logo de la tienda -->
        <div class="logo">
            <a href="../index.html">
                <img src="../img/logo1.png" alt="logo cute">
            </a>
        </div>

        <!-- Barra de navegación -->
        <nav class="barra">
            <ul>
                <li><a href="../index.html">INICIO</a></li>
                <li><a href="../pages/shop.html">SHOP</a></li>
                <li><a href="../pages/nosotros.html">SOBRE NOSOTROS</a></li>
                <li><a href="../pages/politicas.html">POLITICAS DE COMPRA</a></li>
                <li><a href="../pages/contacto.html">CONTACTO</a></li>
            </ul>
        </nav>
    </header>

    <!-- Sección principal -->
    <main>

        <!-- Sección de galería de productos -->
        <section>
            <div class="galeria">
                <div class="fotos">
                    <img src="../img/chicassuper.png" alt="Buzos Chicas">
                    <button class="btn-carrito" data-product="Buzo Chicas Superpoderosas" data-id="chicassuper">Agregar al carrito</button>
                </div>
                <div class="fotos">
                    <img src="../img/dinoo.png" alt="Buzo Dino">
                    <button class="btn-carrito" data-product="Buzo Dinosaurio" data-id="dinoo">Agregar al carrito</button>
                </div>
                <div class="fotos">
                    <img src="../img/chimu.png" alt="Buzos Chimuelos">
                    <button class="btn-carrito" data-product="Buzo Chimuelos" data-id="chimu">Agregar al carrito</button>
                </div>
                <div class="fotos">
                    <img src="../img/stickers.png" alt="Buzo Cupido">
                    <button class="btn-carrito" data-product="Buzo Cupido" data-id="stickers">Agregar al carrito</button>
                </div>
            </div>

            <!--  productos destacados -->
            <h1>PRODUCTOS DESTACADOS</h1>

           
            <div class="productos-destacados">
                <img src="../img/flechaizq.png" alt="flecha izquierda">
                <img src="../img/stickers.png" alt="Personaliza tu buzo">
                <img src="../img/chimu.png" alt="chimuelos">
                <img src="../img/chicassuper.png" alt="chicas superpoderosas">
                <img src="../img/dinoo.png" alt="dino">
                <img src="../img/flechader.png" alt="flecha derecha">
            </div>
        </section>
        <hr>

    </main>

     <!-- Pie de página -->

   
    <footer>
         <!-- navegacion de pie de página -->
        <h3>Navegación</h3>
        <div>
            <ul>
                <li><a href="../index.html">INICIO</a></li>
                <li><a href="../pages/shop.html">SHOP</a></li>
                <li><a href="../pages/nosotros.html">SOBRE NOSOTROS</a></li>
                <li><a href="../pages/politicas.html">POLITICAS DE COMPRA</a></li>
                <li><a href="../pages/contacto.html">CONTACTO</a></li>
            </ul>
        </div>

        <!-- Información de contacto -->
        <h3>Contacto</h3>
        <h4>mail💌: info@cutebaires.com</h4>
        <h4>teléfono: 113654548</h4>
    </footer>

    <script>
    document.querySelectorAll('.btn-carrito').forEach(function(btn) {
        btn.addEventListener('click', function() {
            fbq('track', 'AddToCart', {
                content_name: this.dataset.product,
                content_ids: [this.dataset.id],
                content_type: 'product'
            });
        });
    });
    </script>
</body>

</html>
